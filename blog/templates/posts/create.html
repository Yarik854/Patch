{% extends 'base.html' %}

{% block title %} CREATE {% endblock %}
{% block links %} {% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', path='/posts/style_create_post.css') }}">
<form action="/posts/create" method="POST" class="post_form">
  <div class="form_group">
    <label for="title">Заголовок:</label>
    <input class="inp" id="title" name="title" >
  </div>

  <div class="form_group">
    <label for="content">Текст поста:</label>
    <input  class="inp" id="content" name="content" >
  </div>

  <button type="submit" class="submit_btn">Опубликовать</button>
</form>
{% endblock %}
